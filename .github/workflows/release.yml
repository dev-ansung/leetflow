name: Release LeetFlow Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome Linter
        run: bun run lint

      - name: Run Test Suite
        run: bun test

      - name: Extract Version from Tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Package VSIX Extension
        run: |
          mkdir -p artifacts/vsix
          bun run build
          npx @vscode/vsce package --no-dependencies --out artifacts/vsix/leetflow-${{ steps.get_version.outputs.VERSION }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: LeetFlow v${{ steps.get_version.outputs.VERSION }}
          body_path: CHANGELOG.md
          files: artifacts/vsix/leetflow-${{ steps.get_version.outputs.VERSION }}.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace (Optional)
        if: env.VSCE_PAT != '' && startsWith(github.ref, 'refs/tags/')
        run: npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }} --packagePath artifacts/vsix/leetflow-${{ steps.get_version.outputs.VERSION }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}